name: tmp-cline-kimi-k3-feed

on:
  push:
    branches:
      - research/cline-kimi-k3-free-feed

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Cline Desktop recommended model feed
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            'https://api.cline.bot/api/v1/ai/cline/recommended-models' \
            -H 'HTTP-Referer: https://cline.bot' \
            -H 'X-Title: Cline' \
            -H 'X-IS-MULTIROOT: false' \
            -H 'User-Agent: Cline/0.0.32' \
            -H 'X-CLIENT-TYPE: cline-desktop' \
            -H 'X-CLIENT-VERSION: 0.0.32' \
            -H 'X-PLATFORM: Cline Desktop' \
            -H 'X-PLATFORM-VERSION: 0.0.32' \
            | tee /tmp/feed.json
          echo
          echo '--- Kimi entries ---'
          python3 - <<'PY'
          import json
          with open('/tmp/feed.json') as f:
              data = json.load(f)
          for bucket in ('recommended','free','clinePass'):
              for model in data.get(bucket, []):
                  text = json.dumps(model, ensure_ascii=False).lower()
                  if 'kimi' in text or 'moonshot' in text:
                      print(bucket, json.dumps(model, ensure_ascii=False, sort_keys=True))
          print('--- all free ids ---')
          for model in data.get('free', []):
              print(model.get('id'))
          PY
